name: practica_13
description: "WayraUV Cusco - Monitor de radiacion UV y proteccion solar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.1
  flutter_local_notifications: ^23.0.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0F1E2E"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0F1E2E"
  image: "assets/images/splash_logo.png"
  android_12:
    color: "#0F1E2E"
    icon_background_color: "#0F1E2E"
    image: "assets/images/splash_logo.png"