name: Flutter CI Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality_check:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Entorno Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Analizar Código Estático
        run: flutter analyze

      - name: Instalar Herramientas LCOV
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Ejecutar Script de Cobertura y Validar Umbral (>= 85%)
        run: bash scripts/check_coverage.sh

      - name: Subir Reporte Sanitizado como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/clean_lcov.info